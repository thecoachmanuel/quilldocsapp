<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>QuillDocs — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        background: #f4f4f5;
        color: #18181b;
      }
      .card {
        width: 100%;
        max-width: 400px;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
      }
      .logo {
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.02em;
        margin-bottom: 12px;
      }
      .logo span {
        color: #2563eb;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #52525b;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">Quill<span>Docs</span></div>
      <h1>You are offline</h1>
      <p>Reconnect to the internet to continue chatting with your documents.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
